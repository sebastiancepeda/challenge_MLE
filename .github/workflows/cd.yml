name: 'Continuous Delivery'

on:
  workflow_run:
    workflows: ['Continuous Integration']
    types: [completed]
    branches: [main]

env:
  SERVICE_NAME: latam-delay-api

jobs:
  deploy:
    # Only deploy when CI on main completed successfully.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build container image with Cloud Build
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${SERVICE_NAME}:${GITHUB_SHA::7}"

          BUILD_ID=$(gcloud builds submit --tag "$IMAGE" --async --format='value(id)' --quiet)
          echo "Submitted Cloud Build: $BUILD_ID"
          echo "Console: https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${{ secrets.GCP_PROJECT_ID }}"

          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format='value(status)' 2>/dev/null || echo "UNKNOWN")
            case "$STATUS" in
              SUCCESS)
                echo "Build $BUILD_ID succeeded"
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Build $BUILD_ID ended in status: $STATUS"
                exit 1
                ;;
              QUEUED|WORKING|PENDING|STATUS_UNKNOWN|UNKNOWN)
                sleep 10
                ;;
              *)
                echo "Unexpected build status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 60s \
            --quiet

      - name: Emit service URL
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "${{ secrets.GCP_REGION }}" \
            --format='value(status.url)')
          echo "Deployed: $URL"
          echo "## Deployed ✨" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`$SERVICE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: \`${{ secrets.GCP_REGION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
